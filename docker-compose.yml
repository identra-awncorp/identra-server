# DEVELOPER MACHINES ONLY. Never use this file on the VPS (ADR-0016 §3): it runs the `dev`
# stage, bind-mounts the source, runs `prisma db push` and the seed on every start, ships
# default passwords and JWT secrets, and publishes 4000/5432/6379 on all interfaces.
# Production uses docker-compose.prod.yml.
services:
  api:
    build:
      # Same parent-directory context as production (the image will later need ../identra-sdk).
      context: ..
      dockerfile: identra-server/Dockerfile
      target: dev
    container_name: identra-server-api
    command: sh -c "npx prisma db push && npx prisma db seed && npm run start:dev"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 4000
      HOST: ${HOST:-0.0.0.0}
      API_PREFIX: ${API_PREFIX:-v1}
      APP_NAME: ${APP_NAME:-Identra Server}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:8081,http://localhost:19006}
      DATABASE_URL: postgresql://${POSTGRES_USER:-identra}:${POSTGRES_PASSWORD:-identra_password}@db:5432/${POSTGRES_DB:-identra}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev_access_secret_change_me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev_refresh_secret_change_me}
    ports:
      - "${PORT:-4000}:4000"
    volumes:
      - .:/app
      - identra_node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: identra-server-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-identra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-identra_password}
      POSTGRES_DB: ${POSTGRES_DB:-identra}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - identra_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-identra} -d ${POSTGRES_DB:-identra}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: identra-server-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - identra_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  identra_node_modules:
  identra_postgres_data:
  identra_redis_data:
