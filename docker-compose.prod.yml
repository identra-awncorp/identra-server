# Production stack for the VPS (ADR-0016 §3): api + Postgres + Redis.
#
#   IDENTRA_IMAGE_TAG=<tag> docker compose --env-file /etc/identra/server.env -f docker-compose.prod.yml up -d
#
# The api image is built beforehand with `docker build` (deploy/README.md, "Deploy"): Compose
# never builds or pulls it. `--env-file` feeds the ${VAR:?...} substitutions below and the
# optional settings listed without a value; the api container gets exactly the variables listed
# here (the database and Redis passwords only inside their URLs). Every secret is required and
# has no default: Compose refuses to start when one is missing. Without --env-file Compose would
# read ./.env, so always pass it. The server itself also refuses to start with development
# secrets (src/config/env.validation.ts).
name: identra-prod

# Bounded logs on every service (the 45 GB disk is shared).
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Limits suit a 1 CPU / 3.8 GB host that also runs nginx and cloudflared.
services:
  api:
    # Tag every deploy (the server commit) so it can be rolled back: deploy/README.md.
    image: identra-prod-api:${IDENTRA_IMAGE_TAG:?IDENTRA_IMAGE_TAG is required (deploy/README.md)}
    pull_policy: never
    restart: unless-stopped
    logging: *logging
    mem_limit: 768m
    # Leaves a quarter of the one CPU to Postgres, Redis, nginx and cloudflared.
    cpus: 0.75
    pids_limit: 256
    # The image's dedicated user; its files are root-owned and the root filesystem is read-only.
    # Nothing at start-up writes outside /tmp (Prisma's migrate step included).
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # The image's command: `prisma migrate deploy` (the local CLI, no npm, no network), then the
    # server. No `db push` and no seed in production.
    environment:
      NODE_ENV: production
      # The server refuses to start when this is set and NODE_ENV is not production.
      IDENTRA_DEPLOYMENT: production
      # Keep the V8 heap well inside mem_limit so GC runs before the OOM killer does.
      NODE_OPTIONS: --max-old-space-size=512
      HOST: 0.0.0.0
      PORT: 4000
      # Credential features: canonical identifiers and the keys mounted below. The trust-list
      # source defaults to /run/identra/keys/trust-list.source.json.
      IDENTRA_PUBLIC_BASE_URL: https://api-identra.awncorp.vn
      IDENTRA_KEYS_DIR: /run/identra/keys
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:?POSTGRES_DB is required}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      AUTH_REGISTRATION_TOKEN_SECRET: ${AUTH_REGISTRATION_TOKEN_SECRET:?AUTH_REGISTRATION_TOKEN_SECRET is required}
      PASSWORD_PEPPER: ${PASSWORD_PEPPER:?PASSWORD_PEPPER is required}
      OTP_HMAC_SECRET: ${OTP_HMAC_SECRET:?OTP_HMAC_SECRET is required}
      # Optional (.env.production.example): taken from the env file when set there, else unset.
      IDENTRA_ORG_API_KEY_HASHES:
      OTP_DEMO_ENABLED:
      OTP_DEMO_CODE:
      OTP_DEMO_PHONE_ALLOWLIST:
      APP_NAME:
      API_PREFIX:
      JWT_ACCESS_TTL_SECONDS:
      JWT_REFRESH_TTL_DAYS:
      AUTH_REGISTRATION_TOKEN_TTL_SECONDS:
      PASSWORD_PEPPER_VERSION:
      GRAPHQL_INTROSPECTION:
      GRAPHQL_GRAPHIQL:
      GRAPHQL_RATE_LIMIT_FAIL_CLOSED:
      VERIFICATION_MAX_LIVE_SESSIONS:
      ISSUANCE_MAX_LIVE_NONCES:
      ISSUANCE_MAX_LIVE_OFFERS:
    ports:
      # nginx on the host proxies api-identra.awncorp.vn here; never bind 0.0.0.0.
      - "127.0.0.1:4000:4000"
    volumes:
      # Signing keys live on the host, outside the repo and the image (ADR-0016 §6), owned by
      # uid 10001 (deploy/README.md, "Keys").
      - /etc/identra/keys:/run/identra/keys:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # /v1/health answers 503 when Postgres or Redis is down (200 for ok and degraded).
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4000/v1/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/v1/health | grep -q '\"status\":\"ok\"'"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    mem_limit: 768m
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    # No ports: reachable only on the Compose network.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *logging
    mem_limit: 160m
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    # noeviction: Redis holds sessions, offers and rate-limit counters that must not vanish
    # silently. When the 128 MB are full, writes fail with an OOM error instead: /v1/auth
    # answers 503 (rate limiter fail-closed), other REST routes skip rate limiting, the GraphQL
    # cache falls back to process memory and the GraphQL cost limiter follows
    # GRAPHQL_RATE_LIMIT_FAIL_CLOSED (true in .env.production.example: GraphQL refuses).
    # Watch `used_memory` (redis-cli info memory) and raise the limit before it gets there.
    command: ["sh", "-c", "exec redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy noeviction --requirepass \"$${REDIS_PASSWORD}\""]
    # No ports: reachable only on the Compose network.
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
